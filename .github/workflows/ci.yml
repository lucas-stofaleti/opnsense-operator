name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify compilation
        run: go build ./...

  drift-check:
    name: Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate manifests and code
        run: make manifests generate

      - name: Fail if generated files are out of sync
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "Generated files are out of sync with the source."
            echo "Run 'make manifests generate' locally and commit the result."
            exit 1
          fi

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm chart
        run: make helm-lint

  helm-chart-drift:
    name: Helm Chart Drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [drift-check, helm-lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kubebuilder
        run: |
          curl -Lo /tmp/kubebuilder \
            https://github.com/kubernetes-sigs/kubebuilder/releases/download/v4.13.1/kubebuilder_linux_amd64
          chmod +x /tmp/kubebuilder
          sudo mv /tmp/kubebuilder /usr/local/bin/kubebuilder

      - name: Check Helm chart drift
        run: make helm-chart-drift

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, build, drift-check]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          go mod tidy
          make test

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=cover.out \
            | grep "^github.com/lucas-stofaleti/opnsense-operator/internal" \
            | awk '{gsub(/%/, "", $3); sum += $3; count++} END {if (count > 0) printf "%.1f", sum/count; else print "0"}')
          echo "Coverage (internal): ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < 80" | bc)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below the 80% threshold for ./internal/..."
            exit 1
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Dependent on unit tests AND helm checks passing first to save compute time
    needs: [test, helm-chart-drift]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Run e2e tests
        run: |
          go mod tidy
          make test-e2e

  # Gatekeeper job specifically designed for Branch Protection / Merge Queues
  ci-success:
    name: CI Pass
    runs-on: ubuntu-24.04
    needs: [lint, build, drift-check, helm-lint, helm-chart-drift, test, e2e]
    if: always()
    steps:
      - name: Check aggregate job status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs completed successfully!"