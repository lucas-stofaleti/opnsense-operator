name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Ensure triggered from main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "This workflow can only be run from the 'main' branch (got '${{ github.ref_name }}')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${VERSION}'. Expected format: vX.Y.Z (e.g. v0.1.0)."
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          VERSION="${{ inputs.version }}"
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "Tag ${VERSION} already exists."
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [validate]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          curl -Lo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Install Helm
        run: make install-helm

      - name: Set release variables
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          IMG="ghcr.io/lucas-stofaleti/opnsense-operator:${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_NUM=${VERSION_NUM}" >> "$GITHUB_ENV"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"

      - name: Patch Chart.yaml (ephemeral, not committed)
        run: |
          yq e -i ".version = \"${VERSION_NUM}\"" charts/chart/Chart.yaml
          yq e -i ".appVersion = \"${VERSION}\"" charts/chart/Chart.yaml

      - name: Patch values.yaml (ephemeral, not committed)
        run: |
          yq e -i ".manager.image.tag = \"${VERSION}\"" charts/chart/values.yaml

      - name: Build and push multi-arch image
        run: make docker-buildx IMG="${IMG}"

      - name: Generate install bundle
        run: make build-installer IMG="${IMG}"

      - name: Package Helm chart
        run: helm package charts/chart/ --version "${VERSION_NUM}" --app-version "${VERSION}" -d dist/

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
            dist/install.yaml \
            dist/opnsense-operator-${VERSION_NUM}.tgz \
            --title "${VERSION}" \
            --generate-notes

  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [release]
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          curl -Lo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set release variables
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_NUM=${VERSION_NUM}" >> "$GITHUB_ENV"

      - name: Patch Chart.yaml (ephemeral, not committed)
        run: |
          yq e -i ".version = \"${VERSION_NUM}\"" charts/chart/Chart.yaml
          yq e -i ".appVersion = \"${VERSION}\"" charts/chart/Chart.yaml

      - name: Patch values.yaml (ephemeral, not committed)
        run: |
          yq e -i ".manager.image.tag = \"${VERSION}\"" charts/chart/values.yaml

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            echo "gh-pages branch not found; creating an initial empty branch."
            git checkout --orphan gh-pages
            git rm -rf . > /dev/null 2>&1 || true
            git commit --allow-empty -m "chore: initialize gh-pages branch"
            git push origin gh-pages
            git checkout "${GITHUB_REF_NAME}"
          fi

      - name: Package Helm chart
        run: helm package charts/chart/ -d .cr-release-packages/

      - name: Publish chart to gh-pages
        run: |
          PACKAGE="opnsense-operator-${VERSION_NUM}.tgz"
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/$(basename "$GITHUB_REPOSITORY")"

          git worktree add /tmp/gh-pages origin/gh-pages
          cp ".cr-release-packages/${PACKAGE}" "/tmp/gh-pages/${PACKAGE}"

          if [ -f /tmp/gh-pages/index.yaml ]; then
            helm repo index /tmp/gh-pages --url "${PAGES_URL}" --merge /tmp/gh-pages/index.yaml
          else
            helm repo index /tmp/gh-pages --url "${PAGES_URL}"
          fi

          cd /tmp/gh-pages
          git add "${PACKAGE}" index.yaml
          git commit -m "chore: publish ${PACKAGE}"
          git push origin HEAD:gh-pages
