apiVersion: firewall.opnsense.io/v1alpha1
kind: FirewallRule
metadata:
  name: firewallrule-sample
spec:
  connectionRef:
    name: opnsenseconnection-sample
  enabled: true
  action: pass
  direction: in
  interface: lan
  ipProtocol: inet
  protocol: TCP
  source:
    net: any
  destination:
    net: any
    port: "443"
  quick: true
  log: false
  description: Allow LAN to Any (HTTPS / 443)
  # sequence is optional — omit it to let OPNsense auto-assign the position.
  # sequence: 1000
